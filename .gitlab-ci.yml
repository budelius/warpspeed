# CI for the WarpSpeed fork.
#
# Shape mirrors gitlab.com/martin-wieser/locke: a `lint` stage gated on merge
# requests and `dev`, and a tag-gated release stage. What differs is what
# "publish" means -- this repo ships no packages, so it builds the `warpspeed`
# binary and keeps it as a job artifact.
#
# Runner
# ------
# Everything runs on the self-hosted `obachan-staging-oss` project runner, the
# same one locke uses. Two consequences:
#
#   * The tag is mandatory. That runner has `run_untagged: false`, so an
#     untagged job is not merely slower -- it never gets picked up and ends as
#     `stuck_pending_no_matching_runners`.
#   * Self-hosted minutes are not billed against the GitLab.com compute quota,
#     so the compile jobs run automatically rather than behind `when: manual`.
#     `build:warpspeed` is the exception on `dev`: a release build of a GPU
#     desktop app occupies a runner shared with granny, locke, and ojiichan for
#     a long stretch, so on `dev` it is opt-in and on version tags it is
#     automatic.
#
# Build image
# -----------
# The compile jobs run on a prebuilt image, `docker/ci/Dockerfile`, with Warp's
# Linux build dependencies already installed. They previously ran
# `script/linux/install_build_deps` in a `before_script`, which cannot work on
# this runner: its containers are not root and have no sudo, so every apt-get
# failed and the job never reached cargo. Baking the dependencies in removes the
# privileged step altogether, and stops every job re-downloading protoc.
#
# The image tag tracks the channel in rust-toolchain.toml. When that is bumped,
# rebuild and republish the image and update `image:` below -- see the header of
# docker/ci/Dockerfile for the two commands.
#
# Verified: config passes GitLab's CI lint, `fmt` has completed a real run, and
# the image builds and compiles the workspace locally. The compile jobs have not
# yet completed a run on the runner itself.

stages:
  - lint
  - build

default:
  image: registry.gitlab.com/martin-wieser/warpspeed/ci:1.92.0
  tags:
    - obachan-staging-oss
  interruptible: true

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
  # Incremental artefacts are pure cost in CI: nothing is reused across jobs.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  # Upstream CI uses line-tables-only; drop debug info entirely. Warp's build
  # tree is large enough that this is worth the lost backtrace detail.
  RUSTFLAGS: "-C debuginfo=0 --cfg=web_sys_unstable_apis"
  WARP_SKIP_SUDO_PROMPT: "1"

cache:
  # Registry and git checkouts only. `target/` is deliberately not cached: a
  # Warp build tree is tens of gigabytes, so uploading it would cost more than
  # the rebuild it saves.
  key: cargo-$CI_COMMIT_REF_SLUG
  paths:
    - .cache/cargo

fmt:
  stage: lint
  # rustfmt needs no system libraries, so this job stays on the stock image
  # rather than pulling the much larger build image to parse source files.
  image: rust:1-bookworm
  variables:
    # rustfmt only parses -- it never reads the ONNX models or the Windows
    # PDBs, so skip the ~147 MB LFS payload and the system packages entirely.
    GIT_LFS_SKIP_SMUDGE: "1"
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "dev"

clippy:
  stage: lint
  timeout: 3h
  variables:
    # The OSS Kubernetes runner is memory-bounded; even two concurrent rustc
    # processes exhausted the pod while compiling Warp's desktop dependency
    # graph. Serialize compilation so clippy reaches the managed-session code.
    CARGO_BUILD_JOBS: "1"
  script:
    - cat /etc/warpspeed-ci-image
    - df -h / | tail -1
    # Keep the managed HTTP client in its small library and validate it with
    # the terminal transport it relies on. Building the entire GPU desktop app
    # exceeds this runner's pod limit even with one rustc process; full app
    # integration is still covered by local/release builds.
    - cargo clippy -p managed_agent_sessions -p warp_terminal --all-targets --locked -- -D warnings
    - cargo test -p managed_agent_sessions -p warp_terminal --lib --locked
    - df -h / | tail -1
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "dev"

build:warpspeed:
  stage: build
  timeout: 3h
  script:
    - cat /etc/warpspeed-ci-image
    - df -h / | tail -1
    - cargo build -p warp --release --bin warpspeed --locked
    - df -h / | tail -1
  artifacts:
    name: "warpspeed-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    paths:
      - target/release/warpspeed
    expire_in: 30 days
  rules:
    # Anchored at both ends on purpose. Upstream tags releases as
    # `v0.2026.06.03.09.49.stable_00`, which an unanchored pattern would match --
    # so pushing upstream tags would fire a release build. Fork tags are plain
    # three-part semver: `v1.0.0`.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: true
