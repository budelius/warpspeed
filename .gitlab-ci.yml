# CI for the WarpSpeed fork.
#
# Shape mirrors gitlab.com/martin-wieser/locke: a `lint` stage gated on merge
# requests and `dev`, and a tag-gated release stage. What differs is what
# "publish" means -- this repo ships no packages, so it builds the `warpspeed`
# binary and keeps it as a job artifact.
#
# Runner
# ------
# Everything runs on the self-hosted `obachan-staging-oss` project runner, the
# same one locke uses. Two consequences:
#
#   * The tag is mandatory. That runner has `run_untagged: false`, so an
#     untagged job is not merely slower -- it never gets picked up and ends as
#     `stuck_pending_no_matching_runners`.
#   * Self-hosted minutes are not billed against the GitLab.com compute quota,
#     so the compile jobs run automatically rather than behind `when: manual`.
#     `build:warpspeed` is the exception on `dev`: a release build of a GPU
#     desktop app occupies a runner shared with granny, locke, and ojiichan for
#     a long stretch, so on `dev` it is opt-in and on version tags it is
#     automatic.
#
# Container caveat: script/linux/install_build_deps sources script/warp_sudo,
# which shells out to `sudo` unconditionally. These images run as root and have
# no sudo, so it is installed first and WARP_SKIP_SUDO_PROMPT bypasses the
# interactive confirmation.
#
# Verified: config passes GitLab's CI lint, and `fmt` has completed a real run.
# The compile jobs have not yet completed one -- expect the first `clippy` to
# need adjustment.

stages:
  - lint
  - build

default:
  image: rust:1-bookworm
  tags:
    - obachan-staging-oss
  interruptible: true

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
  # Incremental artefacts are pure cost in CI: nothing is reused across jobs.
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  # Upstream CI uses line-tables-only; drop debug info entirely. Warp's build
  # tree is large enough that this is worth the lost backtrace detail.
  RUSTFLAGS: "-C debuginfo=0 --cfg=web_sys_unstable_apis"
  WARP_SKIP_SUDO_PROMPT: "1"

cache:
  # Registry and git checkouts only. `target/` is deliberately not cached: a
  # Warp build tree is tens of gigabytes, so uploading it would cost more than
  # the rebuild it saves.
  key: cargo-$CI_COMMIT_REF_SLUG
  paths:
    - .cache/cargo

fmt:
  stage: lint
  variables:
    # rustfmt only parses -- it never reads the ONNX models or the Windows
    # PDBs, so skip the ~147 MB LFS payload and the system packages entirely.
    GIT_LFS_SKIP_SMUDGE: "1"
  script:
    - rustup component add rustfmt
    - cargo fmt --all -- --check
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "dev"

clippy:
  stage: lint
  timeout: 3h
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends sudo
    - ./script/linux/install_build_deps
    - rustup component add clippy
  script:
    - df -h / | tail -1
    # Scoped to the `warp` package: command-signatures-v2 needs Node/yarn and
    # `integration` needs libclang, neither of which this image provides.
    - cargo clippy -p warp --lib --locked -- -D warnings
    - df -h / | tail -1
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "dev"

build:warpspeed:
  stage: build
  timeout: 3h
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends sudo
    - ./script/linux/install_build_deps
  script:
    - df -h / | tail -1
    - cargo build -p warp --release --bin warpspeed --locked
    - df -h / | tail -1
  artifacts:
    name: "warpspeed-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    paths:
      - target/release/warpspeed
    expire_in: 30 days
  rules:
    # Anchored at both ends on purpose. Upstream tags releases as
    # `v0.2026.06.03.09.49.stable_00`, which an unanchored pattern would match --
    # so pushing upstream tags would fire a release build. Fork tags are plain
    # three-part semver: `v1.0.0`.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
    - if: $CI_COMMIT_BRANCH == "dev"
      when: manual
      allow_failure: true
