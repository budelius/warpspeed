name: macOS build

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS app
    runs-on: macos-arm64
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "3"
      CARGO_TERM_COLOR: always
      RUSTFLAGS: "-C debuginfo=0 --cfg=web_sys_unstable_apis"
      WARP_SKIP_SUDO_PROMPT: "1"

    steps:
      # The runner is a launchd daemon whose PATH has neither Homebrew nor Cargo.
      - name: Prepare host tools
        shell: bash
        run: |
          set -euo pipefail
          for dir in "$HOME/.cargo/bin" /opt/homebrew/bin /usr/local/bin; do
            echo "$dir" >> "$GITHUB_PATH"
          done
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          command -v git-lfs || brew install git-lfs
          git lfs install --skip-repo
          for tool in cargo rustup cargo-bundle xcodebuild; do
            printf '%s: %s\n' "$tool" "$(command -v "$tool" || echo missing)"
          done

      # The runner is a shared Mac that also builds iOS apps; refuse to fill its disk.
      - name: Check free disk space
        shell: bash
        run: |
          set -euo pipefail
          free_gib=$(( $(df -k "$HOME" | awk 'NR==2 {print $4}') / 1024 / 1024 ))
          echo "Free: ${free_gib} GiB"
          if (( free_gib < 15 )); then
            echo "::error::Only ${free_gib} GiB free on the runner; a WarpSpeed build needs 15 GiB."
            exit 1
          fi

      - name: Check out source and LFS assets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: true
          persist-credentials: false

      - name: Install release tools
        shell: bash
        run: ./script/install_cargo_release_deps

      - name: Build app bundle
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          # Stop the build before it fills the shared runner's disk.
          workspace=$PWD
          (
            while sleep 15; do
              if (( $(df -k "$HOME" | awk 'NR==2 {print $4}') < 3 * 1024 * 1024 )); then
                echo "::error::Under 3 GiB free on the runner; stopping the build."
                pkill -TERM -f "$workspace/" || true
                exit
              fi
            done
          ) &
          watchdog=$!
          trap 'kill $watchdog 2>/dev/null || true' EXIT
          ./script/bundle --channel oss --debug --nouniversal --selfsign --no-dmg
          codesign --verify --deep --strict target/debug/bundle/osx/WarpOss.app

      - name: Package app bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          git rev-parse HEAD > ci-artifacts/source-commit.txt
          ditto -c -k --sequesterRsrc --keepParent \
            target/debug/bundle/osx/WarpOss.app ci-artifacts/WarpOss-macos-arm64.zip
          shasum -a 256 ci-artifacts/WarpOss-macos-arm64.zip \
            > ci-artifacts/WarpOss-macos-arm64.zip.sha256

      - name: Upload downloadable macOS build
        uses: actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de
        with:
          name: WarpOss-macos-arm64-${{ github.sha }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 30
