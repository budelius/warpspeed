# CI for the WarpSpeed fork.
#
# Shape mirrors gitlab.com/martin-wieser/locke: a `lint` stage gated on merge
# requests and `dev`, and a `publish` stage gated on version tags. What differs
# is what "publish" means -- this repo ships no packages, so the publish stage
# builds the `warpspeed` binary and keeps it as a job artifact.
#
# Both jobs install Linux build dependencies via the upstream-maintained
# `script/linux/install_build_deps`, rather than pinning an apt list here that
# would drift from upstream.
#
# UNVERIFIED: these jobs have never run. Warp is a GPU-accelerated desktop app
# with a large dependency graph; expect the first pipeline to need adjustment,
# and expect a cold build to be slow. Both jobs are pinned to the
# `obachan-staging-oss` runner because a full Warp build is not viable on
# GitLab's shared runners -- confirm that runner is available to this project
# before expecting green pipelines.

stages:
  - lint
  - publish

variables:
  CARGO_TERM_COLOR: always
  CARGO_HOME: "$CI_PROJECT_DIR/.cache/cargo"
  # Matches upstream CI: keep debug info minimal so runners don't run out of disk.
  RUSTFLAGS: "-C debuginfo=line-tables-only --cfg=web_sys_unstable_apis"

cache:
  # Only the registry/git cache. `target/` is deliberately not cached -- a Warp
  # build tree runs to tens of gigabytes and would exceed any sane cache budget.
  key: cargo-$CI_COMMIT_REF_SLUG
  paths:
    - .cache/cargo

lint:
  stage: lint
  image: rust:1-bookworm
  tags:
    - obachan-staging-oss
  before_script:
    - ./script/linux/install_build_deps
    - rustup component add rustfmt clippy
  script:
    - cargo fmt --all -- --check
    # Scoped to the `warp` package: `command-signatures-v2` needs Node/yarn and
    # `integration` needs libclang, neither of which this image provides.
    - cargo clippy -p warp --lib -- -D warnings
  rules:
    - if: $CI_MERGE_REQUEST_ID
    - if: $CI_COMMIT_BRANCH == "dev"

publish:warpspeed:
  stage: publish
  image: rust:1-bookworm
  tags:
    - obachan-staging-oss
  before_script:
    - ./script/linux/install_build_deps
  script:
    - cargo build -p warp --release --bin warpspeed
  artifacts:
    name: "warpspeed-$CI_COMMIT_TAG"
    paths:
      - target/release/warpspeed
    expire_in: 30 days
  rules:
    # Anchored at both ends on purpose. Upstream tags releases as
    # `v0.2026.06.03.09.49.stable_00`, which an unanchored pattern would match --
    # so pushing upstream tags would fire a release build. Fork tags are plain
    # three-part semver: `v1.0.0`.
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
