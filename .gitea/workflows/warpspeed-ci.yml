name: WarpSpeed CI

on:
  push:
    branches: [dev]
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
  workflow_dispatch:
    inputs:
      build_release:
        description: Build and retain the Linux WarpSpeed binary (dev only)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: warpspeed-ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "3"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-C debuginfo=0 --cfg=web_sys_unstable_apis"
  WARP_SKIP_SUDO_PROMPT: "1"

jobs:
  fmt:
    name: Rust formatting
    if: >-
      ${{ github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: harbor.pseekoo.io/stozn-warpspeed/ci:1.92.0@sha256:007adbd65f1054905c436b9d50bc1e940619dd14f754331639352bf421c00c90
    env:
      GIT_LFS_SKIP_SMUDGE: "1"

    steps:
      - name: Install the Actions runtime
        shell: bash
        run: |
          set -euo pipefail
          node_archive=/tmp/node-v20.20.2-linux-x64.tar.xz
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            --output "$node_archive" \
            https://nodejs.org/dist/v20.20.2/node-v20.20.2-linux-x64.tar.xz
          echo "df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d  $node_archive" \
            | sha256sum --check
          tar -xJf "$node_archive" --directory /usr/local --strip-components=1
          node --version

      - name: Check out the exact commit without LFS payloads
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          github-server-url: http://gitea-http.gitea.svc:3000

      - name: Check Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

  clippy:
    name: Rust lint
    if: >-
      ${{ github.event_name == 'pull_request' ||
          github.event_name == 'workflow_dispatch' ||
          github.ref == 'refs/heads/dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: harbor.pseekoo.io/stozn-warpspeed/ci:1.92.0@sha256:007adbd65f1054905c436b9d50bc1e940619dd14f754331639352bf421c00c90
    env:
      CARGO_BUILD_JOBS: "1"

    steps:
      - name: Install the Actions runtime
        shell: bash
        run: |
          set -euo pipefail
          node_archive=/tmp/node-v20.20.2-linux-x64.tar.xz
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            --output "$node_archive" \
            https://nodejs.org/dist/v20.20.2/node-v20.20.2-linux-x64.tar.xz
          echo "df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d  $node_archive" \
            | sha256sum --check
          tar -xJf "$node_archive" --directory /usr/local --strip-components=1
          node --version

      - name: Check out the exact commit without LFS payloads
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: false
          github-server-url: http://gitea-http.gitea.svc:3000

      - name: Run Clippy
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/warpspeed-ci-image
          df -h / | tail -1
          cargo clippy -p managed_agent_sessions -p warp_terminal --all-targets --locked -- -D warnings
          cargo test -p managed_agent_sessions -p warp_terminal --lib --locked
          df -h / | tail -1

  build_selection:
    name: Select release build
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact_name: ${{ steps.select.outputs.artifact_name }}
      enabled: ${{ steps.select.outputs.enabled }}

    steps:
      - name: Select an exact semver tag or requested dev build
        id: select
        shell: bash
        env:
          REQUESTED_BUILD: ${{ inputs.build_release }}
        run: |
          set -euo pipefail
          enabled=false
          artifact_name=

          if [[ "$GITHUB_EVENT_NAME" == push && \
                "$GITHUB_REF" =~ ^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            enabled=true
            artifact_name="warpspeed-${BASH_REMATCH[1]}"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && \
                  "$REQUESTED_BUILD" == true ]]; then
            if [[ "$GITHUB_REF" != refs/heads/dev ]]; then
              echo "Manual release builds are restricted to the dev branch." >&2
              exit 1
            fi
            enabled=true
            artifact_name="warpspeed-${GITHUB_SHA:0:8}"
          fi

          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

  build:
    name: Build WarpSpeed
    needs: build_selection
    if: ${{ needs.build_selection.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container:
      image: harbor.pseekoo.io/stozn-warpspeed/ci:1.92.0@sha256:007adbd65f1054905c436b9d50bc1e940619dd14f754331639352bf421c00c90

    steps:
      - name: Install pinned Actions checkout dependencies
        shell: bash
        run: |
          set -euo pipefail
          node_archive=/tmp/node-v20.20.2-linux-x64.tar.xz
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            --output "$node_archive" \
            https://nodejs.org/dist/v20.20.2/node-v20.20.2-linux-x64.tar.xz
          echo "df770b2a6f130ed8627c9782c988fda9669fa23898329a61a871e32f965e007d  $node_archive" \
            | sha256sum --check
          tar -xJf "$node_archive" --directory /usr/local --strip-components=1

          lfs_archive=/tmp/git-lfs-linux-amd64-v3.7.1.tar.gz
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            --output "$lfs_archive" \
            https://github.com/git-lfs/git-lfs/releases/download/v3.7.1/git-lfs-linux-amd64-v3.7.1.tar.gz
          echo "1c0b6ee5200ca708c5cebebb18fdeb0e1c98f1af5c1a9cba205a4c0ab5a5ec08  $lfs_archive" \
            | sha256sum --check
          tar -xzf "$lfs_archive" --directory /tmp git-lfs-3.7.1/git-lfs
          install --mode 0755 /tmp/git-lfs-3.7.1/git-lfs /usr/local/bin/git-lfs

          node --version
          git lfs version

      - name: Check out the exact commit with LFS payloads
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          lfs: true
          github-server-url: http://gitea-http.gitea.svc:3000

      - name: Build the release binary
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/warpspeed-ci-image
          df -h / | tail -1
          cargo build -p warp --release --bin warpspeed --locked
          df -h / | tail -1

      - name: Retain the release binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ needs.build_selection.outputs.artifact_name }}
          path: target/release/warpspeed
          if-no-files-found: error
          retention-days: 30
