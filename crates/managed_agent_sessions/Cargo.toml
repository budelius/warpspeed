[package]
name = "managed_agent_sessions"
version = "0.1.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
tui = ["dep:ratatui", "dep:unicode-width"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
instant.workspace = true
log.workspace = true
ratatui = { version = "0.30", optional = true, features = ["unstable-rendered-line-info"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
unicode-width = { workspace = true, optional = true }
uuid.workspace = true
warp_cli.workspace = true
warp_core.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
